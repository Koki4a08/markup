# Builds the Markup desktop app for every platform and attaches the installers
# to a GitHub release, plus the small "Markup Setup" bootstrapper for Windows and
# the standalone `markup` CLI binaries that markup.here/install.sh and install.ps1 download.
#
# - Push a tag like v0.2.0 to build and publish that release.
# - Or run it by hand (Actions > Release > Run workflow) with an existing tag to
#   add or rebuild the installers of that release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (for example v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple silicon
            os: macos-latest
          # GitHub retired the Intel macOS runners (macos-13), so the Intel build
          # is cross-compiled on Apple silicon.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
          - name: Linux x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # The `markup` CLI ships inside the app as a sidecar, compiled for this runner...
      - if: ${{ !matrix.target }}
        run: pnpm --filter @markup/mcp compile
      # ...or, when cross-compiling, for the target, named the way Tauri expects.
      - if: ${{ matrix.target }}
        working-directory: packages/mcp
        run: node compile.mjs --target ${{ matrix.bun-target }} --triple ${{ matrix.target }}

      # Signs the update bundles and uploads latest.json, the feed the app's updater polls
      # (plugins.updater in tauri.conf.json). The public half of the key lives in that config.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          projectPath: apps/app
          tauriScript: pnpm exec tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ env.TAG }}
          releaseName: Markup ${{ env.TAG }}
          releaseBody: |
            Download Markup for your platform below.

            - **Windows:** `Markup-Setup.exe` installs the newest version for your user and opens it. The `.exe` and `.msi` are full offline installers.
            - **macOS:** `aarch64.dmg` for Apple silicon, `x64.dmg` for Intel. Builds are not notarized yet: if macOS refuses to open Markup, choose Open Anyway in System Settings > Privacy & Security.
            - **Linux:** `.AppImage` (run `chmod +x` first), `.deb` or `.rpm`.
          # Stay a draft until every platform and Markup Setup are attached, so
          # "latest" never points at a half-built release. The setup job publishes it.
          releaseDraft: true
          prerelease: false

  cli:
    name: CLI (${{ matrix.name }})
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun cross-compiles Linux and Windows from one runner. macOS builds run on
          # macOS so the binaries carry the ad-hoc signature Apple silicon requires.
          - name: Linux and Windows
            os: ubuntu-latest
            targets: linux-x64:bun-linux-x64 linux-arm64:bun-linux-arm64 windows-x64.exe:bun-windows-x64
            smoke: linux-x64
          - name: macOS
            os: macos-latest
            targets: macos-arm64:bun-darwin-arm64 macos-x64:bun-darwin-x64
            smoke: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile

      - name: Compile
        working-directory: packages/mcp
        run: |
          for pair in ${{ matrix.targets }}; do
            node compile.mjs --target "${pair#*:}" --out "dist/release/markup-cli-${pair%%:*}"
          done

      - name: Smoke test
        working-directory: packages/mcp/dist/release
        run: |
          test "$(./markup-cli-${{ matrix.smoke }} --version)" = "${TAG#v}"
          ./markup-cli-${{ matrix.smoke }} --help

      # The binaries carry the Bun runtime (about 100 MB); compressed they download in a third of the time.
      - name: Compress
        working-directory: packages/mcp/dist/release
        run: |
          for f in markup-cli-*; do
            case "$f" in
              *.exe) zip -9 -q "${f%.exe}.zip" "$f" ;;
              *) gzip -9 -k "$f" ;;
            esac
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/mcp/dist/release
        run: gh release upload "$TAG" markup-cli-*.gz markup-cli-*.zip --clobber

  extension:
    name: Browser extension
    needs: desktop
    runs-on: ubuntu-latest
    # Job-level so the signing step's `if` can see whether the secrets exist.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Each release ships the extension with the release's version, so Firefox
      # signing (which never accepts a version twice) always gets a new one.
      - name: Build for Chromium and Firefox
        working-directory: apps/extension
        run: EXTENSION_VERSION="${TAG#v}" pnpm build

      - name: Package for Chrome, Edge, Brave and Opera
        working-directory: apps/extension/dist
        run: zip -qr ../Markup-Snapshot-Chrome.zip .

      - name: Lint for Firefox
        working-directory: apps/extension
        run: npx -y web-ext@8 lint --source-dir dist-firefox --self-hosted

      # Free signing by Mozilla as an unlisted add-on, so Firefox installs the
      # .xpi straight from the website. Skipped until the AMO API key exists.
      - name: Sign for Firefox
        if: ${{ env.AMO_JWT_ISSUER != '' }}
        working-directory: apps/extension
        run: |
          npx -y web-ext@8 sign --channel unlisted --source-dir dist-firefox --artifacts-dir signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv signed/*.xpi Markup-Snapshot-Firefox.xpi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/extension
        run: |
          gh release upload "$TAG" Markup-Snapshot-Chrome.zip --clobber
          if [ -f Markup-Snapshot-Firefox.xpi ]; then
            gh release upload "$TAG" Markup-Snapshot-Firefox.xpi --clobber
          fi

  setup:
    name: Markup Setup (Windows)
    needs: [desktop, cli, extension]
    runs-on: windows-latest
    steps:
      # Setup always fetches the newest release at run time, so it is built from
      # the branch that runs the workflow, not from the release tag.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/installer/src-tauri

      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds the built UI, so it must exist before cargo test.
      - name: Build the setup UI
        working-directory: apps/installer
        run: pnpm build
      - name: Unit tests
        working-directory: apps/installer/src-tauri
        run: cargo test
      - name: Build Markup-Setup.exe
        working-directory: apps/installer
        run: pnpm exec tauri build --no-bundle

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$TAG" apps/installer/src-tauri/target/release/Markup-Setup.exe --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest
